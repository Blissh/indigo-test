services:
  # Backend API Service
  - type: web
    name: productsapi
    runtime: docker
    dockerfilePath: ./ProductsAPI/Dockerfile
    dockerContext: ./ProductsAPI
    plan: free  # Plan gratuito (se duerme después de 15 min de inactividad)
    region: oregon
    healthCheckPath: /api/v1/auth/health  # Usar endpoint GET en lugar de POST
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Render proporciona PORT automáticamente (por defecto 10000)
      # ASPNETCORE_URLS se configura en Program.cs usando PORT
      - key: ConnectionStrings__SqlConnection
        sync: false
      - key: ConnectionStrings__BlobStorageConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Jwt__Issuer
        value: ProductsAPI
      - key: Jwt__Audience
        value: ProductsAPIUsers
      - key: Cors__AllowedOrigins
        sync: false

  # Frontend Service - Servicio estático (GRATIS)
  - type: web
    name: frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free  # Plan gratuito
    region: oregon
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: productsapi
          property: url  # Usar 'url' en lugar de 'host' para obtener la URL completa con protocolo

